<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>torrent-streamer</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin:0; font: 15px/1.5 -apple-system, "Segoe UI", Roboto, sans-serif; background:#0f1115; color:#e6e8ec; }
  header { padding:14px 20px; border-bottom:1px solid #23262d; position:sticky; top:0; background:#0f1115; z-index:10; }
  h1 { font-size:18px; margin:0 0 10px; }
  nav { display:flex; gap:8px; margin-bottom:12px; }
  nav button { padding:9px 18px; border:0; border-radius:8px; background:#1c2027; color:#b6bcc8; cursor:pointer; font-size:14px; }
  nav button.active { background:#2f6fed; color:#fff; }
  .add, .search, .key { display:flex; gap:8px; margin-top:8px; }
  .add input, .search input { flex:1; padding:10px 12px; border:1px solid #2c313a; border-radius:8px; background:#161a20; color:#e6e8ec; }
  .add button, .search button, .ctrl button, .album button { padding:10px 16px; border:0; border-radius:8px; background:#2f6fed; color:#fff; cursor:pointer; }
  .add button:hover, .search button:hover, .ctrl button:hover, .album button:hover { background:#3f7dff; }
  .key input { width:100%; max-width:280px; padding:8px 12px; border:1px solid #2c313a; border-radius:8px; background:#161a20; color:#e6e8ec; }
  main { padding:20px; max-width:900px; margin:0 auto; }
  section[hidden] { display:none; }
  #search-results { margin-bottom:16px; }
  .result { border:1px solid #23262d; border-radius:10px; padding:12px 16px; margin-bottom:10px; background:#161a20; display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; }
  .result .title { font-weight:600; }
  .result .meta { color:#8b93a1; font-size:13px; margin-top:2px; }
  .result button { padding:8px 14px; border:0; border-radius:8px; background:#2f6fed; color:#fff; cursor:pointer; }
  .result button:hover { background:#3f7dff; }
  .result button:disabled { background:#2c313a; color:#6b7280; cursor:not-allowed; }
  .album { border:1px solid #23262d; border-radius:10px; padding:14px 16px; margin-bottom:10px; background:#161a20; }
  .album .nm { font-weight:600; margin-bottom:4px; }
  .album .artist { color:#b6bcc8; font-size:13px; margin-bottom:2px; }
  .album .meta { color:#8b93a1; font-size:13px; }
  .head { display:flex; gap:12px; align-items:flex-start; }
  .cover { width:64px; height:64px; border-radius:8px; object-fit:cover; flex:none; }
  .info { flex:1; min-width:0; }
  .bar { height:5px; background:#23262d; border-radius:3px; margin-top:8px; overflow:hidden; }
  .bar div { height:100%; background:#2f6fed; }
  .tracks { margin-top:10px; display:none; border-top:1px solid #23262d; padding-top:10px; }
  .tracks.open { display:block; }
  .track { display:flex; justify-content:space-between; align-items:center; gap:8px; padding:6px 8px; color:#b6bcc8; font-size:14px; border-radius:6px; cursor:pointer; }
  .track:hover { background:#1c2129; }
  .track.current { background:#1e2f4a; color:#fff; }
  .track .tr { color:#8b93a1; font-size:12px; white-space:nowrap; }
  .track .tr.ok { color:#5fd08a; }
  .track.disabled { color:#5a6270; cursor:not-allowed; }
  .album button.del { background:#8a3d3d; }
  .album button.del:hover { background:#a34a4a; }
  .status { font-size:12px; padding:3px 8px; border-radius:5px; background:#23262d; }
  .status.downloading { background:#1e3a2a; color:#5fd08a; }
  .status.complete { background:#1e2f4a; color:#7fb4ff; }

  /* Плеер */
  #player-view .now { display:flex; gap:18px; align-items:center; padding:8px 0 18px; border-bottom:1px solid #23262d; }
  #player-view .cover { width:120px; height:120px; }
  #player-view .np { flex:1; min-width:0; }
  #player-view .np .t { font-size:20px; font-weight:600; margin-bottom:4px; }
  #player-view .np .a { color:#b6bcc8; }
  #player-view .np .s { color:#8b93a1; font-size:13px; margin-top:6px; }
  .ctrl { display:flex; gap:10px; align-items:center; justify-content:center; padding:16px 0; }
  .ctrl button { font-size:18px; width:52px; height:52px; border-radius:50%; }
  .queue { margin-top:6px; }
  .queue h3 { color:#8b93a1; font-size:13px; font-weight:600; text-transform:uppercase; letter-spacing:.5px; margin:0 0 8px; }
  .progress { display:flex; align-items:center; gap:10px; margin-top:10px; }
  .pbar { flex:1; height:5px; background:#23262d; border-radius:3px; overflow:hidden; cursor:pointer; }
  .pbar div { height:100%; background:#2f6fed; width:0%; }
  .progress span { color:#8b93a1; font-size:12px; min-width:36px; text-align:center; }
</style>
</head>
<body>
<header>
  <h1>torrent-streamer</h1>
  <nav>
    <button id="tab-catalog" class="active" onclick="switchTab('catalog')">Каталог</button>
    <button id="tab-player" onclick="switchTab('player')">Плеер</button>
  </nav>
  <div id="catalog-tools">
    <div class="add">
      <input id="link" placeholder="magnet-ссылка или URL торрента">
      <button onclick="add()">Добавить</button>
    </div>
    <div class="search">
      <input id="q" placeholder="поиск релизов на торрентах">
      <button onclick="search()">Поиск</button>
    </div>
    <div class="key">
      <input id="apikey" type="password" placeholder="X-API-Key (опционально)">
    </div>
  </div>
</header>
<main>
  <section id="catalog-view">
    <div id="search-results"></div>
    <div id="albums"></div>
  </section>
  <section id="player-view" hidden>
    <div class="now">
      <img class="cover" id="p-cover" alt="" style="display:none">
      <div class="np">
        <div class="t" id="now-title">Ничего не играет</div>
        <div class="a" id="now-album"></div>
        <div class="s" id="now-state"></div>
        <div class="progress">
          <span id="p-elapsed">0:00</span>
          <div class="pbar" id="p-bar"><div id="p-fill"></div></div>
          <span id="p-duration">0:00</span>
        </div>
      </div>
    </div>
    <div class="ctrl">
      <button onclick="cmd('prev')">⏮</button>
      <button id="btn-playpause" onclick="togglePlay()">▶</button>
      <button onclick="cmd('next')">⏭</button>
      <button onclick="cmd('stop')">⏹</button>
    </div>
    <div class="vol" style="display:flex; align-items:center; justify-content:center; gap:10px; padding:6px 0 12px;">
      <span style="color:#8b93a1; font-size:14px;">🔊</span>
      <input type="range" id="vol" min="0" max="100" value="100" style="width:220px; accent-color:#2f6fed;">
    </div>
    <div class="queue">
      <h3 id="queue-title">Очередь</h3>
      <div id="queue"></div>
    </div>
  </section>
</main>

<script>
let currentAlbumId = null;

async function api(path, opts={}) {
  const headers = {'Content-Type':'application/json'};
  const k = localStorage.getItem('apikey');
  if (k) headers['X-API-Key'] = k;
  const r = await fetch(path, {headers, ...opts});
  if (!r.ok) { const e = await r.text(); throw new Error(e); }
  return r.json();
}
const keyEl = document.getElementById('apikey');
keyEl.value = localStorage.getItem('apikey') || '';
keyEl.addEventListener('input', () => {
  const v = keyEl.value.trim();
  if (v) localStorage.setItem('apikey', v); else localStorage.removeItem('apikey');
});

function switchTab(name) {
  document.getElementById('catalog-view').hidden = (name !== 'catalog');
  document.getElementById('player-view').hidden = (name !== 'player');
  document.getElementById('catalog-tools').style.display = (name === 'catalog') ? '' : 'none';
  document.getElementById('tab-catalog').classList.toggle('active', name === 'catalog');
  document.getElementById('tab-player').classList.toggle('active', name === 'player');
}

async function add() {
  const link = document.getElementById('link').value.trim();
  if (!link) return;
  try {
    const r = await api('/api/add', {method:'POST', body: JSON.stringify({link})});
    document.getElementById('link').value='';
    alert('Добавлено: ' + r.name + ' (' + r.tracks + ' треков)');
    load();
  } catch(e) { alert('Ошибка: ' + e.message); }
}
async function search() {
  const q = document.getElementById('q').value.trim();
  if (!q) return;
  const box = document.getElementById('search-results');
  try {
    const data = await api('/api/search?q=' + encodeURIComponent(q));
    const items = data.results || [];
    if (!items.length) { box.innerHTML = '<p>Ничего не найдено</p>'; return; }
    box.innerHTML = items.map(r => `
      <div class="result">
        <div class="info">
          <div class="title">${esc(r.title)}</div>
          <div class="meta">${esc(r.indexer)} · ${+r.seeders || 0} сидов · ${fmtSize(r.size)}</div>
        </div>
        <button ${r.magnet ? `data-magnet="${esc(r.magnet)}"` : 'disabled'} onclick="addResult(this)">Добавить</button>
      </div>`).join('');
  } catch(e) { box.innerHTML = '<p>Ошибка: ' + esc(e.message) + '</p>'; }
}
async function addResult(btn) {
  const magnet = btn.dataset.magnet;
  if (!magnet) return;
  try {
    await api('/api/add', {method:'POST', body: JSON.stringify({link: magnet})});
    document.getElementById('search-results').innerHTML = '';
    load();
  } catch(e) { alert('Ошибка: ' + e.message); }
}
async function load() {
  try {
    const albums = await api('/api/albums');
    document.getElementById('albums').innerHTML = albums.map(a => `
      <div class="album">
        <div class="head">
          <img class="cover" src="/api/albums/${a.id}/cover" alt="" onerror="this.style.display='none'">
          <div class="info">
            <div class="nm">${esc(a.name)}</div>
            ${a.artist ? `<div class="artist">${esc(a.artist)}</div>` : ''}
            <div class="meta">
              <span class="status ${a.status}">${a.status}</span>
              ${a.progress}% · ${a.tracks} треков
            </div>
            <div class="bar"><div style="width:${a.progress}%"></div></div>
          </div>
        </div>
        <div style="margin-top:10px">
          <button onclick="play(${a.id})">▶ Играть</button>
          <button onclick="tracks(${a.id}, this)">Треки</button>
          <button class="del" onclick="del(${a.id})">Удалить</button>
        </div>
        <div class="tracks" id="tr-${a.id}"></div>
      </div>`).join('');
  } catch(e) { document.getElementById('albums').innerHTML = '<p>Ошибка: '+esc(e.message)+'</p>'; }
}
async function tracks(id, btn) {
  const el = document.getElementById('tr-'+id);
  if (el.classList.contains('open')) { el.classList.remove('open'); return; }
  if (!el.dataset.loaded) {
    const a = await api('/api/albums/'+id+'/files');
    el.innerHTML = a.files.map((f, i) => {
      const ok = f.ready;
      const st = ok ? [f.duration ? fmt(f.duration) : '', f.format].filter(Boolean).join(' · ') : Math.round(f.progress * 100) + '%';
      return `<div class="track ${ok ? '' : 'disabled'}" onclick="${ok ? `playTrack(${id},${i})` : ''}">
        <span>${i+1}. ${esc(f.title || f.name)}</span>
        <span class="tr ${ok ? 'ok' : ''}">${st}</span>
      </div>`;
    }).join('');
    el.dataset.loaded = '1';
  }
  el.classList.add('open');
}
async function del(id) {
  if (!confirm('Удалить альбом?')) return;
  try { await api('/api/albums/'+id, {method:'DELETE'}); load(); }
  catch(e) { alert('Ошибка: '+e.message); }
}
async function play(id) { try { await playTrack(id, 0); } catch(e){ alert('Ошибка: '+e.message); } }
async function playTrack(aid, idx) {
  try { await api('/api/albums/'+aid+'/tracks/'+idx+'/play', {method:'POST'}); switchTab('player'); poll(); }
  catch(e){ alert('Ошибка: '+e.message); }
}
async function cmd(c) { try { await api('/api/player/'+c, {method:'POST'}); poll(); } catch(e){} }
async function togglePlay() {
  try {
    const p = await api('/api/player');
    if (p.state === 'playing') await cmd('pause');
    else if (p.state === 'paused') await cmd('play');
    else alert('Сначала запусти трек');
  } catch(e) { alert('Ошибка: ' + e.message); }
}
async function loadQueue(aid) {
  const box = document.getElementById('queue');
  try {
    const a = await api('/api/albums/'+aid+'/files');
    const p = await api('/api/player');
    box.innerHTML = a.files.map((f, i) => {
      const ok = f.ready;
      const cur = (p.album_id === aid && p.track_index === i);
      const st = ok ? [f.duration ? fmt(f.duration) : '', f.format].filter(Boolean).join(' · ') : Math.round(f.progress * 100) + '%';
      return `<div class="track ${ok ? '' : 'disabled'} ${cur ? 'current' : ''}" onclick="${ok ? `playTrack(${aid},${i})` : ''}">
        <span>${i+1}. ${esc(f.title || f.name)}</span>
        <span class="tr ${ok ? 'ok' : ''}">${st}</span>
      </div>`;
    }).join('');
  } catch(e) { box.innerHTML = ''; }
}
async function poll() {
  try {
    const p = await api('/api/player');
    const volEl = document.getElementById('vol');
    if (volEl && p.volume != null) volEl.value = p.volume;
    const btn = document.getElementById('btn-playpause');
    if (p.state === 'stop') {
      document.getElementById('now-title').textContent = 'Ничего не играет';
      document.getElementById('now-album').textContent = '';
      document.getElementById('now-state').textContent = '';
      document.getElementById('p-cover').style.display = 'none';
      updateProgress(null);
      if (btn) btn.textContent = '▶';
    } else {
      document.getElementById('now-title').textContent = p.track || ('альбом #' + p.album_id);
      document.getElementById('now-album').textContent = [p.artist, p.album].filter(Boolean).join(' — ');
      document.getElementById('now-state').textContent = [p.state, p.format].filter(Boolean).join(' · ');
      const cover = document.getElementById('p-cover');
      if (p.album_id != null) { cover.src = '/api/albums/' + p.album_id + '/cover'; cover.style.display = ''; }
      else cover.style.display = 'none';
      updateProgress(p);
      if (btn) btn.textContent = (p.state === 'playing') ? '⏸' : '▶';
      if (p.album_id !== currentAlbumId) {
        currentAlbumId = p.album_id;
        await loadQueue(p.album_id);
        document.getElementById('queue-title').textContent = p.album || ('Очередь альбома #' + p.album_id);
      } else {
        loadQueue(p.album_id);
      }
    }
  } catch(e) {}
}
function updateProgress(p) {
  const el = document.getElementById('p-elapsed');
  const dur = document.getElementById('p-duration');
  const fill = document.getElementById('p-fill');
  const e = p ? (+p.elapsed || 0) : 0;
  const d = p ? (+p.duration || 0) : 0;
  el.textContent = fmt(e);
  dur.textContent = d ? fmt(d) : '—';
  fill.style.width = (d ? Math.min(100, e / d * 100) : 0) + '%';
}
function fmt(s) { s = +s || 0; const m = Math.floor(s / 60), ss = Math.floor(s % 60); return m + ':' + String(ss).padStart(2, '0'); }
function esc(s){ return (s||'').replace(/[&<>\"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c])); }
function fmtSize(bytes) {
  const n = +bytes || 0;
  if (n >= 1024 * 1024 * 1024) return (n / (1024 * 1024 * 1024)).toFixed(1) + ' ГБ';
  return (n / (1024 * 1024)).toFixed(1) + ' МБ';
}
load(); poll();
setInterval(load, 5000);
setInterval(poll, 3000);
document.getElementById('p-bar').addEventListener('click', async (e) => {
  try {
    const p = await api('/api/player');
    if (!p.duration || p.state === 'stop') return;
    const rect = e.currentTarget.getBoundingClientRect();
    const frac = Math.min(1, Math.max(0, (e.clientX - rect.left) / rect.width));
    const pos = Math.floor(frac * p.duration);
    await api('/api/player/seek?position=' + pos, {method:'POST'});
    poll();
  } catch(err) {}
});
document.getElementById('vol').addEventListener('input', async (e) => {
  try { await api('/api/player/volume?level=' + e.target.value, {method:'POST'}); } catch(err) {}
});
</script>
</body>
</html>
