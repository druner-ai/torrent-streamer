<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>torrent-streamer</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin:0; font: 15px/1.5 -apple-system, "Segoe UI", Roboto, sans-serif; background:#0f1115; color:#e6e8ec; padding-bottom:84px; }
  header { padding:14px 20px; border-bottom:1px solid #23262d; position:sticky; top:0; background:#0f1115; z-index:10; }
  h1 { font-size:18px; margin:0 0 10px; }
  nav { display:flex; gap:8px; margin-bottom:12px; }
  nav button { padding:9px 18px; border:0; border-radius:8px; background:#1c2027; color:#b6bcc8; cursor:pointer; font-size:14px; }
  nav button.active { background:#2f6fed; color:#fff; }
  .add, .search, .key { display:flex; gap:8px; margin-top:8px; }
  .add input, .search input { flex:1; padding:10px 12px; border:1px solid #2c313a; border-radius:8px; background:#161a20; color:#e6e8ec; }
  .add button, .search button, .ctrl button, .album button, .modal-card button.play { padding:10px 16px; border:0; border-radius:8px; background:#2f6fed; color:#fff; cursor:pointer; }
  .add button:hover, .search button:hover, .ctrl button:hover, .album button:hover, .modal-card button.play:hover { background:#3f7dff; }
  .key input { width:100%; max-width:280px; padding:8px 12px; border:1px solid #2c313a; border-radius:8px; background:#161a20; color:#e6e8ec; }
  main { padding:20px; max-width:1100px; margin:0 auto; }
  section[hidden] { display:none; }
  .toolbar { display:flex; align-items:center; gap:12px; margin-bottom:16px; flex-wrap:wrap; }
  .toolbar select { padding:8px 12px; border:1px solid #2c313a; border-radius:8px; background:#161a20; color:#e6e8ec; }
  .chips { display:flex; gap:8px; flex-wrap:wrap; }
  .chip { padding:6px 14px; border-radius:16px; background:#1c2027; color:#b6bcc8; cursor:pointer; font-size:13px; border:1px solid #2c313a; }
  .chip.active { background:#2f6fed; color:#fff; }
  .artists { display:flex; flex-direction:column; gap:8px; }
  .artist-row { display:flex; align-items:center; gap:14px; padding:10px 14px; background:#161a20; border:1px solid #23262d; border-radius:10px; cursor:pointer; }
  .artist-row:hover { background:#1c2027; }
  .artist-row .cover { width:48px; height:48px; border-radius:8px; object-fit:cover; flex:none; }
  .artist-row .nm { font-weight:600; flex:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .artist-row .cnt { color:#8b93a1; font-size:13px; }
  .crumbs { display:flex; align-items:center; gap:12px; margin-bottom:14px; }
  .crumbs .chip { cursor:pointer; }
  .crumb-name { font-weight:600; }
  .badge.fmt { top:auto; bottom:8px; right:8px; color:#c9a86b; }
  .artist.fmt { color:#c9a86b; }
  .ed-row { display:flex; align-items:center; gap:12px; padding:12px 14px; margin-bottom:8px; background:#1c2027; border:1px solid #2c313a; border-radius:10px; cursor:pointer; }
  .ed-row:hover { background:#23262d; }
  .ed-row .nm { font-weight:600; }
  .ed-row .artist { flex:1; color:#8b93a1; font-size:13px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  #search-results { margin-bottom:16px; }
  .result { border:1px solid #23262d; border-radius:10px; padding:12px 16px; margin-bottom:10px; background:#161a20; display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; }
  .result .title { font-weight:600; }
  .result .meta { color:#8b93a1; font-size:13px; margin-top:2px; }
  .result button { padding:8px 14px; border:0; border-radius:8px; background:#2f6fed; color:#fff; cursor:pointer; }
  .result button:hover { background:#3f7dff; }
  .result button:disabled { background:#2c313a; color:#6b7280; cursor:not-allowed; }

  /* Каталог-грид */
  .grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(150px, 1fr)); gap:18px; }
  .card { cursor:pointer; border-radius:10px; overflow:hidden; }
  .card:hover .cover { transform:scale(1.03); }
  .cover-wrap { position:relative; aspect-ratio:1/1; border-radius:10px; overflow:hidden; background:#161a20; }
  .card .cover { width:100%; height:100%; object-fit:cover; display:block; transition:transform .15s ease; }
  .card .nm { font-weight:600; font-size:14px; margin-top:8px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .card .artist { color:#8b93a1; font-size:13px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .badge { position:absolute; top:8px; right:8px; font-size:11px; padding:2px 8px; border-radius:6px; background:rgba(15,17,21,.85); }
  .badge.downloading { color:#5fd08a; }
  .badge.complete { color:#7fb4ff; }
  .badge.stalled { color:#e6b75f; }
  .badge.error { color:#e06c6c; }
  .badge.paused { color:#8b93a1; }

  /* Модалка альбома */
  .modal { position:fixed; inset:0; background:rgba(0,0,0,.6); z-index:20; display:flex; align-items:center; justify-content:center; padding:20px; }
  .modal[hidden] { display:none; }
  .modal-card { background:#161a20; border:1px solid #23262d; border-radius:14px; max-width:640px; width:100%; max-height:85vh; overflow-y:auto; padding:20px; position:relative; }
  .modal-card .close { position:absolute; top:12px; right:14px; background:none; border:0; color:#8b93a1; font-size:20px; cursor:pointer; }
  .m-head { display:flex; gap:16px; align-items:flex-start; }
  .m-head .cover { width:120px; height:120px; border-radius:10px; object-fit:cover; flex:none; }
  .m-head .info { flex:1; min-width:0; }
  .m-head .nm { font-size:20px; font-weight:600; margin-bottom:4px; }
  .m-head .artist { color:#b6bcc8; }
  .m-head .meta { color:#8b93a1; font-size:13px; margin-top:4px; }
  .m-head .acts { margin-top:12px; display:flex; gap:8px; }
  button.del { background:#8a3d3d; }
  button.del:hover { background:#a34a4a; }

  .tracks { margin-top:14px; border-top:1px solid #23262d; padding-top:10px; }
  .track { display:flex; justify-content:space-between; align-items:center; gap:8px; padding:6px 8px; color:#b6bcc8; font-size:14px; border-radius:6px; cursor:pointer; }
  .track:hover { background:#1c2129; }
  .track.current { background:#1e2f4a; color:#fff; }
  .track .tr { color:#8b93a1; font-size:12px; white-space:nowrap; }
  .track .tr.ok { color:#5fd08a; }
  .track .tr.stalled { color:#e6b75f; }
  .track .tr.error { color:#e06c6c; }
  .track .tr.queued { color:#8b93a1; }
  .track.disabled { color:#5a6270; cursor:not-allowed; }

  /* Полноэкранный плеер */
  #player-view .now { display:flex; gap:18px; align-items:center; padding:8px 0 18px; border-bottom:1px solid #23262d; }
  #player-view .cover { width:120px; height:120px; }
  #player-view .np { flex:1; min-width:0; }
  #player-view .np .t { font-size:20px; font-weight:600; margin-bottom:4px; }
  #player-view .np .a { color:#b6bcc8; }
  #player-view .np .s { color:#8b93a1; font-size:13px; margin-top:6px; }
  .ctrl { display:flex; gap:10px; align-items:center; justify-content:center; padding:16px 0; }
  .ctrl button { font-size:18px; width:52px; height:52px; border-radius:50%; }
  .queue { margin-top:6px; }
  .queue h3 { color:#8b93a1; font-size:13px; font-weight:600; text-transform:uppercase; letter-spacing:.5px; margin:0 0 8px; }
  .progress { display:flex; align-items:center; gap:10px; margin-top:10px; }
  .pbar { flex:1; height:5px; background:#23262d; border-radius:3px; overflow:hidden; cursor:pointer; }
  .pbar div { height:100%; background:#2f6fed; width:0%; }
  .progress span { color:#8b93a1; font-size:12px; min-width:36px; text-align:center; }

  /* Мини-плеер (bottom bar) */
  #mini { position:fixed; left:0; right:0; bottom:0; height:68px; background:#161a20; border-top:1px solid #23262d; display:flex; align-items:center; gap:12px; padding:0 16px; z-index:15; cursor:pointer; }
  #mini .cover { width:46px; height:46px; border-radius:7px; object-fit:cover; flex:none; }
  #mini .m-info { flex:1; min-width:0; }
  #mini .m-info .t { font-weight:600; font-size:14px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  #mini .m-info .a { color:#8b93a1; font-size:12px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  #mini button { background:none; border:0; color:#e6e8ec; font-size:20px; cursor:pointer; width:38px; height:38px; border-radius:8px; }
  #mini button:hover { background:#1c2129; }
  #mini .m-bar { position:absolute; top:-2px; left:0; right:0; height:3px; background:#23262d; }
  #mini .m-bar div { height:100%; background:#2f6fed; width:0%; }
</style>
</head>
<body>
<header>
  <h1>torrent-streamer</h1>
  <nav>
    <button id="tab-catalog" class="active" onclick="switchTab('catalog')">Каталог</button>
    <button id="tab-player" onclick="switchTab('player')">Плеер</button>
  </nav>
  <div id="catalog-tools">
    <div class="add">
      <input id="link" placeholder="magnet-ссылка или URL торрента">
      <button onclick="add()">Добавить</button>
    </div>
    <div class="search">
      <input id="q" placeholder="поиск релизов на торрентах">
      <button onclick="search()">Поиск</button>
    </div>
    <div class="key">
      <input id="apikey" type="password" placeholder="X-API-Key (опционально)">
    </div>
  </div>
</header>
<main>
  <section id="catalog-view">
    <div id="search-results"></div>
    <div class="toolbar">
      <select id="sort" onchange="renderCatalog()">
        <option value="added">Недавно добавлено</option>
        <option value="year_desc">По году ↓</option>
        <option value="year_asc">По году ↑</option>
      </select>
      <div id="genres" class="chips"></div>
    </div>
    <div id="albums"></div>
  </section>
  <section id="player-view" hidden>
    <div class="now">
      <img class="cover" id="p-cover" alt="" style="display:none">
      <div class="np">
        <div class="t" id="now-title">Ничего не играет</div>
        <div class="a" id="now-album"></div>
        <div class="s" id="now-state"></div>
        <div class="progress">
          <span id="p-elapsed">0:00</span>
          <div class="pbar" id="p-bar"><div id="p-fill"></div></div>
          <span id="p-duration">0:00</span>
        </div>
      </div>
    </div>
    <div class="ctrl">
      <button onclick="cmd('prev')">⏮</button>
      <button id="btn-playpause" onclick="togglePlay()">▶</button>
      <button onclick="cmd('next')">⏭</button>
      <button onclick="cmd('stop')">⏹</button>
      <button id="sleep-btn" onclick="cycleSleep()" title="Таймер сна">⏰</button>
    </div>
    <div class="vol" style="display:flex; align-items:center; justify-content:center; gap:10px; padding:6px 0 12px;">
      <span style="color:#8b93a1; font-size:14px;">🔊</span>
      <input type="range" id="vol" min="0" max="100" value="100" style="width:220px; accent-color:#2f6fed;">
    </div>
    <div class="queue">
      <h3 id="queue-title">Очередь</h3>
      <div id="queue"></div>
    </div>
  </section>
</main>

<div id="modal" class="modal" hidden>
  <div class="modal-card">
    <button class="close" onclick="closeAlbum()">✕</button>
    <div class="m-head">
      <img class="cover" id="al-cover" alt="">
      <div class="info">
        <div class="nm" id="al-name"></div>
        <div class="artist" id="al-artist"></div>
        <div class="meta" id="al-meta"></div>
        <div class="acts">
          <button class="play" onclick="play(openAlbumId)">▶ Играть</button>
          <button onclick="queueAlbum(openAlbumId)">＋ В очередь</button>
          <button id="fav-btn" onclick="toggleFav(openAlbumId)">☆ В избранное</button>
          <button class="del" onclick="del(openAlbumId)">Удалить</button>
        </div>
      </div>
    </div>
    <div class="tracks" id="al-tracks"></div>
  </div>
</div>

<div id="ed-modal" class="modal" hidden>
  <div class="modal-card" style="max-width:420px">
    <button class="close" onclick="closeEditions()">✕</button>
    <h3 style="margin:0 0 12px">Издания</h3>
    <div id="ed-list"></div>
  </div>
</div>

<div id="mini" onclick="switchTab('player')">
  <div class="m-bar"><div id="m-fill"></div></div>
  <img class="cover" id="m-cover" alt="" style="display:none">
  <div class="m-info">
    <div class="t" id="m-title">Ничего не играет</div>
    <div class="a" id="m-artist"></div>
  </div>
  <button onclick="event.stopPropagation(); cmd('prev')">⏮</button>
  <button id="m-play" onclick="event.stopPropagation(); togglePlay()">▶</button>
  <button onclick="event.stopPropagation(); cmd('next')">⏭</button>
</div>

<script>
let currentAlbumId = null;
let openAlbumId = null;

async function api(path, opts={}) {
  const headers = {'Content-Type':'application/json'};
  const k = localStorage.getItem('apikey');
  if (k) headers['X-API-Key'] = k;
  const r = await fetch(path, {headers, ...opts});
  if (!r.ok) { const e = await r.text(); throw new Error(e); }
  return r.json();
}
const keyEl = document.getElementById('apikey');
keyEl.value = localStorage.getItem('apikey') || '';
keyEl.addEventListener('input', () => {
  const v = keyEl.value.trim();
  if (v) localStorage.setItem('apikey', v); else localStorage.removeItem('apikey');
});

function switchTab(name) {
  document.getElementById('catalog-view').hidden = (name !== 'catalog');
  document.getElementById('player-view').hidden = (name !== 'player');
  document.getElementById('catalog-tools').style.display = (name === 'catalog') ? '' : 'none';
  document.getElementById('tab-catalog').classList.toggle('active', name === 'catalog');
  document.getElementById('tab-player').classList.toggle('active', name === 'player');
}

async function add() {
  const link = document.getElementById('link').value.trim();
  if (!link) return;
  try {
    const r = await api('/api/add', {method:'POST', body: JSON.stringify({link})});
    document.getElementById('link').value='';
    alert('Добавлено: ' + r.name + ' (' + r.tracks + ' треков)');
    load();
  } catch(e) { alert('Ошибка: ' + e.message); }
}
async function search() {
  const q = document.getElementById('q').value.trim();
  if (!q) return;
  const box = document.getElementById('search-results');
  try {
    const data = await api('/api/search?q=' + encodeURIComponent(q));
    const items = data.results || [];
    if (!items.length) { box.innerHTML = '<p>Ничего не найдено</p>'; return; }
    box.innerHTML = items.map(r => `
      <div class="result">
        <div class="info">
          <div class="title">${esc(r.title)}</div>
          <div class="meta">${esc(r.indexer)} · ${+r.seeders || 0} сидов · ${fmtSize(r.size)}</div>
        </div>
        <button ${r.magnet ? `data-magnet="${esc(r.magnet)}"` : 'disabled'} onclick="addResult(this)">Добавить</button>
      </div>`).join('');
  } catch(e) { box.innerHTML = '<p>Ошибка: ' + esc(e.message) + '</p>'; }
}
async function addResult(btn) {
  const magnet = btn.dataset.magnet;
  if (!magnet) return;
  try {
    await api('/api/add', {method:'POST', body: JSON.stringify({link: magnet})});
    document.getElementById('search-results').innerHTML = '';
    load();
  } catch(e) { alert('Ошибка: ' + e.message); }
}
function albumBadge(a) {
  if (a.status === 'complete') return 'готово';
  if (a.status === 'stalled') return 'нет пиров';
  if (a.status === 'error') return 'ошибка';
  if (a.status === 'paused') return 'пауза';
  if (a.status === 'downloading') return (a.progress || 0) + '%';
  return a.status || '';
}
function fileStatus(f) {
  if (f.state === 'ready') return [f.duration ? fmt(f.duration) : '', f.format].filter(Boolean).join(' · ');
  if (f.state === 'downloading') return Math.round(f.progress * 100) + '%';
  if (f.state === 'stalled') return 'нет пиров';
  if (f.state === 'error') return 'ошибка';
  if (f.state === 'queued') return 'в очереди';
  return Math.round((f.progress || 0) * 100) + '%';
}
let albumsCache = [];
let activeGenre = null;
let showFav = false;
let activeArtist = null;   // null = список исполнителей

const COVER_PLACEHOLDER = 'data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%22150%22 height=%22150%22%3E%3Crect fill=%22%231c2027%22 width=%22150%22 height=%22150%22/%3E%3Ctext x=%2275%22 y=%2278%22 fill=%22%235a6270%22 font-size=%2230%22 text-anchor=%22middle%22%3E♪%3C/text%3E%3C/svg%3E';

async function load() {
  try {
    albumsCache = await api('/api/albums');
    renderGenres();
    renderCatalog();
  } catch(e) { document.getElementById('albums').innerHTML = '<p>Ошибка: '+esc(e.message)+'</p>'; }
}
function filtered() {
  let list = [...albumsCache];
  if (showFav) list = list.filter(a => a.favorite);
  if (activeGenre) list = list.filter(a => a.genre === activeGenre);
  return list;
}
function releaseHtml(editions) {
  const a = editions[0];
  const multi = editions.length > 1;
  const onclick = multi ? `openEditions(${a.id})` : `openAlbum(${a.id})`;
  const fmts = [...new Set(editions.map(e => e.format).filter(Boolean))].join(' · ');
  return `
    <div class="card" onclick="${onclick}">
      <div class="cover-wrap">
        <img class="cover" src="/api/albums/${a.id}/cover" alt="" onerror="this.src='${COVER_PLACEHOLDER}'">
        <span class="badge ${a.status}">${albumBadge(a)}</span>
        ${multi ? '<span class="badge fmt">' + editions.length + ' издания</span>' : ''}
      </div>
      <div class="nm">${esc(a.name)}</div>
      ${a.artist ? `<div class="artist">${esc(a.artist)}${a.year ? ' · ' + esc(a.year) : ''}</div>` : ''}
      ${fmts ? `<div class="artist fmt">${esc(fmts)}</div>` : ''}
    </div>`;
}
function renderCatalog() {
  const box = document.getElementById('albums');
  if (activeArtist !== null) renderArtistAlbums(box);
  else renderArtists(box);
}
function renderArtists(box) {
  const map = {};
  for (const a of filtered()) {
    const key = a.artist || 'Разное';
    (map[key] = map[key] || []).push(a);
  }
  const names = Object.keys(map).sort((x, y) => x.localeCompare(y, 'ru'));
  if (!names.length) {
    box.innerHTML = '<p style="color:#8b93a1">Пока пусто — добавь альбом</p>';
    return;
  }
  box.innerHTML = '<div class="artists">' + names.map(n => {
    const first = map[n][0];
    return `<div class="artist-row" onclick="openArtist('${esc(n)}')">
      <img class="cover" src="/api/albums/${first.id}/cover" alt="" onerror="this.src='${COVER_PLACEHOLDER}'">
      <div class="nm">${esc(n)}</div>
      <div class="cnt">${map[n].length}</div>
    </div>`;
  }).join('') + '</div>';
}
function openArtist(name) {
  activeArtist = name;
  renderCatalog();
}
function backToArtists() {
  activeArtist = null;
  renderCatalog();
}
function renderArtistAlbums(box) {
  let list = filtered().filter(a => (a.artist || 'Разное') === activeArtist);
  const sort = document.getElementById('sort').value;
  if (sort === 'year_desc') list.sort((a, b) => (+b.year || 0) - (+a.year || 0));
  else if (sort === 'year_asc') list.sort((a, b) => (+a.year || 0) - (+b.year || 0));
  // группируем издания одного релиза по release_key
  const groups = {};
  const order = [];
  for (const a of list) {
    const k = a.release_key || ((a.artist || '') + '|' + a.name);
    if (!groups[k]) { groups[k] = []; order.push(k); }
    groups[k].push(a);
  }
  box.innerHTML = `
    <div class="crumbs">
      <button class="chip" onclick="backToArtists()">← Исполнители</button>
      <span class="crumb-name">${esc(activeArtist)}</span>
    </div>
    <div class="grid">${order.map(k => releaseHtml(groups[k])).join('')}</div>`;
}
function openEditions(aid) {
  const a = albumsCache.find(x => x.id === aid);
  if (!a) return;
  const k = a.release_key || ((a.artist || '') + '|' + a.name);
  const editions = albumsCache.filter(x => (x.release_key || ((x.artist || '') + '|' + x.name)) === k);
  document.getElementById('ed-list').innerHTML = editions.map(e => `
    <div class="ed-row" onclick="openAlbum(${e.id}); closeEditions();">
      <div class="nm">${esc(e.format || 'формат?')}</div>
      <div class="artist">${esc(e.name)}</div>
      <span class="badge ${e.status}" style="position:static">${albumBadge(e)}</span>
    </div>`).join('');
  document.getElementById('ed-modal').hidden = false;
}
function closeEditions() { document.getElementById('ed-modal').hidden = true; }
function renderGenres() {
  const genres = [...new Set(albumsCache.map(a => a.genre).filter(Boolean))].sort();
  const box = document.getElementById('genres');
  const favCount = albumsCache.filter(a => a.favorite).length;
  const favChip = favCount
    ? `<span class="chip ${showFav ? 'active' : ''}" onclick="toggleFavFilter()">★ ${favCount}</span>`
    : '';
  box.innerHTML = favChip + genres.map(g => `<span class="chip ${g === activeGenre ? 'active' : ''}" onclick="filterGenre(this)">${esc(g)}</span>`).join('');
}
function toggleFavFilter() {
  showFav = !showFav;
  renderGenres();
  renderCatalog();
}
function filterGenre(el) {
  const g = el.textContent;
  activeGenre = (activeGenre === g) ? null : g;
  renderGenres();
  renderCatalog();
}
async function openAlbum(id) {
  openAlbumId = id;
  const modal = document.getElementById('modal');
  modal.hidden = false;
  document.getElementById('al-cover').src = '/api/albums/' + id + '/cover';
  try {
    const a = await api('/api/albums/' + id + '/files');
    document.getElementById('al-name').textContent = a.name || ('альбом #' + id);
    document.getElementById('al-artist').textContent = a.artist || '';
    const first = a.files[0] || {};
    document.getElementById('al-meta').textContent = [first.year, first.genre, a.files.length + ' треков'].filter(Boolean).join(' · ');
    const alb = albumsCache.find(x => x.id === id);
    setFavBtn(alb ? alb.favorite : false);
    document.getElementById('al-tracks').innerHTML = a.files.map((f, i) => {
      const ok = f.ready;
      const st = fileStatus(f);
      return `<div class="track ${ok ? '' : 'disabled'}" onclick="${ok ? `playTrack(${id},${i})` : ''}">
        <span>${i+1}. ${esc(f.title || f.name)}</span>
        <span class="tr ${f.state}">${st}</span>
      </div>`;
    }).join('');
  } catch(e) { document.getElementById('al-tracks').innerHTML = '<p>Ошибка: ' + esc(e.message) + '</p>'; }
}
function closeAlbum() { document.getElementById('modal').hidden = true; openAlbumId = null; }
document.getElementById('modal').addEventListener('click', (e) => { if (e.target === e.currentTarget) closeAlbum(); });

async function del(id) {
  if (!confirm('Удалить альбом?')) return;
  try { await api('/api/albums/'+id, {method:'DELETE'}); closeAlbum(); load(); }
  catch(e) { alert('Ошибка: '+e.message); }
}
async function play(id) { try { await playTrack(id, 0); } catch(e){ alert('Ошибка: '+e.message); } }
async function playTrack(aid, idx) {
  try { await api('/api/albums/'+aid+'/tracks/'+idx+'/play', {method:'POST'}); closeAlbum(); switchTab('player'); poll(); }
  catch(e){ alert('Ошибка: '+e.message); }
}
async function cmd(c) { try { await api('/api/player/'+c, {method:'POST'}); poll(); } catch(e){} }
async function togglePlay() {
  try {
    const p = await api('/api/player');
    if (p.state === 'playing') await cmd('pause');
    else if (p.state === 'paused') await cmd('play');
    else alert('Сначала запусти трек');
  } catch(e) { alert('Ошибка: ' + e.message); }
}
async function loadQueue(aid) {
  const box = document.getElementById('queue');
  try {
    const q = await api('/api/queue');
    if (!q.queue.length) { box.innerHTML = '<p style="color:#8b93a1">Очередь пуста</p>'; return; }
    box.innerHTML = q.queue.map((e, i) => {
      return `<div class="track ${e.current ? 'current' : ''}" onclick="queueJump(${i})">
        <span>${i+1}. ${esc(e.title)}</span>
        <span class="tr">${e.current ? '▶' : ''}</span>
      </div>`;
    }).join('');
  } catch(e) { box.innerHTML = ''; }
}
async function queueJump(pos) {
  try { await api('/api/queue/jump?pos=' + pos, {method:'POST'}); poll(); } catch(e){}
}
async function queueAlbum(id) {
  try {
    const a = await api('/api/albums/'+id+'/files');
    for (let i = 0; i < a.files.length; i++) {
      if (a.files[i].ready) {
        await api('/api/queue', {method:'POST', body: JSON.stringify({album_id: id, track_index: i, mode: 'end'})});
      }
    }
    poll();
  } catch(e) { alert('Ошибка: ' + e.message); }
}
function setFavBtn(fav) {
  const b = document.getElementById('fav-btn');
  if (b) b.textContent = fav ? '★ В избранном' : '☆ В избранное';
}
async function toggleFav(id) {
  try {
    const r = await api('/api/albums/'+id+'/favorite', {method:'POST'});
    setFavBtn(r.favorite);
    const a = albumsCache.find(x => x.id === id);
    if (a) a.favorite = r.favorite;
    renderCatalog();
    renderGenres();
  } catch(e) { alert('Ошибка: ' + e.message); }
}
const SLEEPS = [15, 30, 60, 0];
let sleepIdx = 0;
async function cycleSleep() {
  const m = SLEEPS[sleepIdx % SLEEPS.length];
  sleepIdx++;
  await api('/api/player/sleep?minutes=' + m, {method:'POST'});
  document.getElementById('sleep-btn').textContent = m ? ('⏰ ' + m + 'м') : '⏰';
  document.getElementById('now-state').textContent = m ? ('стоп через ' + m + ' мин') : '';
}
function renderMini(p) {
  const cover = document.getElementById('m-cover');
  if (p.state === 'stop') {
    document.getElementById('m-title').textContent = 'Ничего не играет';
    document.getElementById('m-artist').textContent = '';
    cover.style.display = 'none';
    document.getElementById('m-fill').style.width = '0%';
    document.getElementById('m-play').textContent = '▶';
    return;
  }
  document.getElementById('m-title').textContent = p.track || ('альбом #' + p.album_id);
  document.getElementById('m-artist').textContent = [p.artist, p.album].filter(Boolean).join(' — ');
  if (p.album_id != null) { cover.src = '/api/albums/' + p.album_id + '/cover'; cover.style.display = ''; }
  const e = +p.elapsed || 0, d = +p.duration || 0;
  document.getElementById('m-fill').style.width = (d ? Math.min(100, e / d * 100) : 0) + '%';
  document.getElementById('m-play').textContent = (p.state === 'playing') ? '⏸' : '▶';
}
async function poll() {
  try {
    const p = await api('/api/player');
    renderMini(p);
    const volEl = document.getElementById('vol');
    if (volEl && p.volume != null) volEl.value = p.volume;
    const btn = document.getElementById('btn-playpause');
    if (p.state === 'stop') {
      document.getElementById('now-title').textContent = 'Ничего не играет';
      document.getElementById('now-album').textContent = '';
      document.getElementById('now-state').textContent = '';
      document.getElementById('p-cover').style.display = 'none';
      updateProgress(null);
      if (btn) btn.textContent = '▶';
    } else {
      document.getElementById('now-title').textContent = p.track || ('альбом #' + p.album_id);
      document.getElementById('now-album').textContent = [p.artist, p.album].filter(Boolean).join(' — ');
      document.getElementById('now-state').textContent = [p.state, p.format].filter(Boolean).join(' · ');
      const cover = document.getElementById('p-cover');
      if (p.album_id != null) { cover.src = '/api/albums/' + p.album_id + '/cover'; cover.style.display = ''; }
      else cover.style.display = 'none';
      updateProgress(p);
      if (btn) btn.textContent = (p.state === 'playing') ? '⏸' : '▶';
      if (p.album_id !== currentAlbumId) {
        currentAlbumId = p.album_id;
        await loadQueue(p.album_id);
        document.getElementById('queue-title').textContent = p.album || ('Очередь альбома #' + p.album_id);
      } else {
        loadQueue(p.album_id);
      }
    }
  } catch(e) {}
}
function updateProgress(p) {
  const el = document.getElementById('p-elapsed');
  const dur = document.getElementById('p-duration');
  const fill = document.getElementById('p-fill');
  const e = p ? (+p.elapsed || 0) : 0;
  const d = p ? (+p.duration || 0) : 0;
  el.textContent = fmt(e);
  dur.textContent = d ? fmt(d) : '—';
  fill.style.width = (d ? Math.min(100, e / d * 100) : 0) + '%';
}
function fmt(s) { s = +s || 0; const m = Math.floor(s / 60), ss = Math.floor(s % 60); return m + ':' + String(ss).padStart(2, '0'); }
function esc(s){ return (s||'').replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function fmtSize(bytes) {
  const n = +bytes || 0;
  if (n >= 1024 * 1024 * 1024) return (n / (1024 * 1024 * 1024)).toFixed(1) + ' ГБ';
  return (n / (1024 * 1024)).toFixed(1) + ' МБ';
}
load(); poll();
setInterval(load, 5000);
setInterval(poll, 3000);
document.getElementById('p-bar').addEventListener('click', async (e) => {
  try {
    const p = await api('/api/player');
    if (!p.duration || p.state === 'stop') return;
    const rect = e.currentTarget.getBoundingClientRect();
    const frac = Math.min(1, Math.max(0, (e.clientX - rect.left) / rect.width));
    const pos = Math.floor(frac * p.duration);
    await api('/api/player/seek?position=' + pos, {method:'POST'});
    poll();
  } catch(err) {}
});
document.getElementById('vol').addEventListener('input', async (e) => {
  try { await api('/api/player/volume?level=' + e.target.value, {method:'POST'}); } catch(err) {}
});
</script>
