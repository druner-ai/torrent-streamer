# MPD (Music Player Daemon) — шаблон конфига.
# Запускается на ХОСТЕ (не в Docker): нужен прямой доступ к ALSA/USB-DAC.
# install.sh копирует этот файл в /etc/mpd.conf

music_directory    "/home/nuc/torrent-streamer/data/qbt/qBittorrent/downloads"
playlist_directory "/var/lib/mpd/playlists"
db_file            "/var/lib/mpd/tag_cache"
state_file         "/var/lib/mpd/state"
sticker_file       "/var/lib/mpd/sticker.sql"

log_file           "/var/log/mpd/mpd.log"
pid_file           "/run/mpd/pid"

user               "mpd"
bind_to_address    "127.0.0.1"
port               "6600"

# --- Вывод звука ---
# Для bit-perfect вывода указывай конкретное устройство USB-DAC (см. `aplay -L`):
#   device "hw:1,0"
# Пока DAC не подключён — device "default" (системный микшер ALSA).
audio_output {
    type          "alsa"
    name          "USB-DAC"
    device        "default"
    mixer_type    "software"
}

# HTTP-потоки (TorrServer) разрешены по умолчанию — audio_output с type http не нужен,
# MPD сам тянет http:// URL и играет через ALSA.

filesystem_charset "UTF-8"
