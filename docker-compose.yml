# Torrent-streamer — self-hosted аудио-стример с торрентов.
# Развёртывание: ./scripts/install.sh && docker compose up -d
#
# Полный стек ОДНОЙ командой (qBittorrent + FlareSolverr в контейнерах):
#   docker compose --profile full up -d
# (см. README «Полный стек» — пароль qbt, DOWNLOADS_DIR, лимиты FlareSolverr.)
#
# Альтернатива: downloader (qbittorrent-nox) и плеер (MPD) на ХОСТЕ (не здесь):
#   - qbittorrent-nox — качает торренты (sequential), работает за CGNAT (18 MiB/s проверено).
#   - MPD — bit-perfect вывод через ALSA/USB-DAC.
# Backend (FastAPI) работает в Docker с network_mode: host — ему нужен доступ к
#   MPD (127.0.0.1:6600) и qbittorrent WebUI (127.0.0.1:8080) на хосте.

services:
  backend:
    build:
      context: .
      dockerfile: services/backend/Dockerfile
    container_name: torrent-streamer-backend
    restart: unless-stopped
    network_mode: host
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - |
          import sys
          import urllib.request
          try:
              with urllib.request.urlopen("http://127.0.0.1:8000/api/health", timeout=3) as response:
                  sys.exit(0 if response.status == 200 else 1)
          except Exception:
              sys.exit(1)
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    environment:
      - QBT_URL=http://127.0.0.1:8080
      - QBT_USER=admin
      - QBT_PASS=${QBT_PASS:-}
      - MPD_HOST=127.0.0.1
      - MPD_PORT=6600
      - DB_PATH=/data/catalog.db
      - OAAT_TARGET=${OAAT_TARGET:-}
      - OAAT_ENDPOINTS=${OAAT_ENDPOINTS:-}
      - OAAT_CONTROL_TOKEN=${OAAT_CONTROL_TOKEN:-}
      - TS_CONTROLLER_SOCK=/tmp/ts-controller.sock
      - PROWLARR_URL=${PROWLARR_URL:-http://127.0.0.1:9696}
      - PROWLARR_API_KEY=${PROWLARR_API_KEY:-}
      - FLARESOLVERR_URL=${FLARESOLVERR_URL:-http://127.0.0.1:8191}
      - RUTRACKER_LOGIN=${RUTRACKER_LOGIN:-}
      - RUTRACKER_PASSWORD=${RUTRACKER_PASSWORD:-}
      - FRONTEND_AUTH=${FRONTEND_AUTH:-}
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
    volumes:
      - ./data:/data
      # Каталог загрузок qBittorrent: пробрасывается ТЕМ ЖЕ путём, что и на хосте —
      # backend берёт абсолютные пути файлов прямо из qbt API.
      # Задайте DOWNLOADS_DIR в .env (абсолютный путь, напр. /srv/torrents/downloads).
      - ${DOWNLOADS_DIR:-/srv/torrents/downloads}:${DOWNLOADS_DIR:-/srv/torrents/downloads}:ro
      # Второй маунт того же каталога в /downloads — для qbt из профиля "full"
      # (его save_path = /downloads/...): пути из qbt API резолвятся в backend.
      - ${DOWNLOADS_DIR:-/srv/torrents/downloads}:/downloads:ro
      # Медиапапки (USB-диски / сетевые монтирования NAS) — источники для
      # сканирования в «Настройки → Медиапапки». Пути должны совпадать с хостовыми
      # (в т.ч. точки монтирования из /etc/fstab). Не используются — оставьте как есть,
      # docker создаст пустые каталоги.
      - ${MEDIA_DIR1:-/mnt/music}:${MEDIA_DIR1:-/mnt/music}:ro
      - ${MEDIA_DIR2:-/mnt/nas-music}:${MEDIA_DIR2:-/mnt/nas-music}:ro

  # P1.6: публичный доступ одним флагом — Tailscale-sidecar (профиль "public").
  # Включить: TS_AUTHKEY=*** в .env и `docker compose --profile public up -d`.
  # Контейнер делит network namespace с backend (здесь = host), и SoundVault
  # становится доступен из вашего tailnet по http://<tailscale-ip>:8000
  # (без проброса портов и reverse-proxy). Auth-ключ:
  #   https://login.tailscale.com/admin/settings/keys (reusable, ephemeral ok).
  # ВНИМАНИЕ: не включайте, если на хосте уже работает tailscaled — два
  #   демона в одном netns конфликтуют (используйте существующий).
  tailscale:
    image: tailscale/tailscale:latest
    profiles: ["public"]
    container_name: torrent-streamer-tailscale
    network_mode: service:backend
    hostname: ${TS_HOSTNAME:-soundvault}
    environment:
      - TS_AUTHKEY=${TS_AUTHKEY}
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_EXTRA_ARGS=${TS_EXTRA_ARGS:-}
    volumes:
      - ts-state:/var/lib/tailscale
    devices:
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - NET_ADMIN
      - NET_RAW
    restart: unless-stopped
    depends_on:
      - backend

  # Полный стек (профиль "full"): qBittorrent + FlareSolverr рядом с backend.
  #   docker compose --profile full up -d
  # qbt WebUI: 127.0.0.1:8080 (loopback), логин admin; временный пароль ПЕРВОГО
  # старта — в `docker compose logs qbittorrent` (его же можно ввести в мастере
  # настройки SoundVault; смену пароля qbt поддерживает только через свой WebUI/API).
  qbittorrent:
    image: linuxserver/qbittorrent:5.3.0
    profiles: ["full"]
    container_name: torrent-streamer-qbittorrent
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=UTC
      - WEBUI_PORT=8080
      # Пароль WebUI из .env: init-скрипт (custom-cont-init.d) выставляет его при
      # ПЕРВОМ старте вместо случайного временного. Не задан — дефолт linuxserver.
      - QBT_PASS=${QBT_PASS:-}
    volumes:
      - qbt-config:/config
      # Каталог загрузок монтируется в /downloads (дефолт qbt) — save_path из
      # qbt API (/downloads/...) совпадает с тем же томом в backend.
      - ${DOWNLOADS_DIR:-/srv/torrents/downloads}:/downloads
      # init-хук: ставит WebUI-пароль из QBT_PASS при первом старте (идемпотентно).
      - ./services/qbittorrent:/custom-cont-init.d:ro
    # Только loopback: WebUI qbt не торчит в LAN/интернет. Backend работает в
    # host-сети и достучится по 127.0.0.1:8080. Пир-порт торрентов наружу НЕ
    # публикуется — входящие соединения пиров и так работают через CGNAT/NAT
    # (исходящие коннекты + DHT), а лишних открытых портов не будет.
    ports:
      - "127.0.0.1:8080:8080"
    restart: unless-stopped

  # Обход Cloudflare для RuTracker (нужен для витрины трекера и скачивания).
  # Лимит 1 CPU / 1 ГБ — как на боевом NUC: решение CF-challenge не должно
  # мешать звуку. Только loopback — наружу не торчит.
  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    profiles: ["full"]
    container_name: torrent-streamer-flaresolverr
    environment:
      - LOG_LEVEL=info
    ports:
      - "127.0.0.1:8191:8191"
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1g
    restart: unless-stopped

volumes:
  ts-state:
  qbt-config:
