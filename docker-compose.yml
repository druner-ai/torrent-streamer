# Torrent-streamer — self-hosted аудио-стример с торрентов.
# Развёртывание: ./scripts/install.sh && docker compose up -d
#
# Downloader (qbittorrent-nox) и плеер (MPD) запускаются на ХОСТЕ (не здесь):
#   - qbittorrent-nox — качает торренты (sequential), работает за CGNAT (18 MiB/s проверено).
#   - MPD — bit-perfect вывод через ALSA/USB-DAC.
# Backend (FastAPI) работает в Docker с network_mode: host — ему нужен доступ к
#   MPD (127.0.0.1:6600) и qbittorrent WebUI (127.0.0.1:8080) на хосте.

services:
  backend:
    build: ./services/backend
    container_name: torrent-streamer-backend
    restart: unless-stopped
    network_mode: host
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - |
          import sys
          import urllib.request
          try:
              with urllib.request.urlopen("http://127.0.0.1:8000/api/health", timeout=3) as response:
                  sys.exit(0 if response.status == 200 else 1)
          except Exception:
              sys.exit(1)
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    environment:
      - QBT_URL=http://127.0.0.1:8080
      - QBT_USER=admin
      - QBT_PASS=${QBT_PASS:-adminadmin}
      - MPD_HOST=127.0.0.1
      - MPD_PORT=6600
      - DB_PATH=/data/catalog.db
      - OAAT_TARGET=${OAAT_TARGET:-192.168.31.215:9740}
      - TUNE_BRIDGE=/usr/local/bin/tune-bridge
    volumes:
      - ./data:/data
      - /home/nuc/oaat/target/debug/tune-bridge:/usr/local/bin/tune-bridge:ro
      - /home/nuc/torrent-streamer/data/qbt/qBittorrent/downloads:/home/nuc/torrent-streamer/data/qbt/qBittorrent/downloads:ro
